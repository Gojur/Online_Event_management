<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="admin-dashboard.html">
            Admin Dashboard
        </a>

        <div>

            <a
                href="registered-users.html"
                class="btn btn-light btn-sm">

                Registered Users

            </a>

            <button
                onclick="logout()"
                class="btn btn-danger btn-sm">

                Logout

            </button>

        </div>

    </div>

</nav>


<div class="container my-5">

    <h1>
        Admin Dashboard
    </h1>

    <p class="text-muted">
        Manage events
    </p>


    <!-- ADD EVENT -->

    <div class="card shadow mb-5">

        <div class="card-body">

            <h4>
                Add New Event
            </h4>


            <form id="eventForm">

                <input
                    type="hidden"
                    id="eventId">


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Title
                        </label>

                        <input
                            type="text"
                            id="eventTitle"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            id="eventLocation"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="eventDate"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Event Time
                        </label>

                        <input
                            type="time"
                            id="eventTime"
                            class="form-control"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Capacity
                        </label>

                        <input
                            type="number"
                            id="eventCapacity"
                            class="form-control"
                            min="1"
                            required>

                    </div>


                    <div class="col-12 mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="eventDescription"
                            class="form-control"
                            rows="4"
                            required>
                        </textarea>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Save Event

                </button>


                <button
                    type="button"
                    onclick="clearEventForm()"
                    class="btn btn-secondary">

                    Clear

                </button>

            </form>


            <div id="adminMessage"
                 class="mt-3">
            </div>

        </div>

    </div>


    <!-- EVENTS -->

    <div class="card shadow">

        <div class="card-body">

            <h4 class="mb-4">
                Manage Events
            </h4>


            <div
                id="adminEventsContainer"
                class="row g-4">

                Loading events...

            </div>

        </div>

    </div>

</div>


<script src="js/auth.js"></script>
<script src="js/events.js"></script>

</body>

</html>
